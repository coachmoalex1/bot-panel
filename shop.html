<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a16;--mute:#7a7268;--line:#ece5da;--acc:#0f6b57;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14110e;--card:#1e1a16;--ink:#f3ede4;--mute:#a79d90;--line:#2e2822;--acc:#3fc3a0;--on:#0b1f19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tajawal,system-ui,sans-serif;padding-bottom:110px}
.w{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:28px 0 14px}h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.5px}
.m{color:var(--mute);font-size:14px;margin:4px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.p .i{aspect-ratio:1;background:var(--line);display:grid;place-items:center;font-size:34px;color:var(--mute);overflow:hidden}
.p .i img{width:100%;height:100%;object-fit:cover;display:block}
.p .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.p b{font-size:16px}.p .d{font-size:13px;color:var(--mute);flex:1}
.pr{font-weight:800;color:var(--acc)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:44px;padding:8px 14px;background:var(--acc);color:var(--on);cursor:pointer}
button:disabled{opacity:.6}
button.o{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.q{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.q button{min-width:44px;padding:0;font-size:20px}
/* السلة: تبويب صغير عايم */
#bar{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;pointer-events:none;z-index:5}
#cb{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px 6px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:pop .25s ease}
#cb .ic{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px}
#cb .n{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--on);color:var(--acc);font-size:12px;font-weight:800;display:grid;place-items:center;line-height:1}
#cb .t{font-weight:800}
@keyframes pop{from{transform:translateY(14px) scale(.9);opacity:0}}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
#sh>div{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px}
.l{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ln{display:flex;align-items:center;gap:8px}
.ln button{min-height:32px;min-width:32px;padding:0;font-size:18px;border-radius:50%}
.pay{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;margin:10px 0}
.e{text-align:center;color:var(--mute);padding:40px 0}
footer{text-align:center;padding:28px 0 0;font-size:13px}footer a{color:var(--mute)}
</style></head><body>
<div class="w"><header><h1 id="n">...</h1><p class="m" id="h"></p></header><div class="g" id="g"></div><div class="e" id="e">جاري التحميل...</div>
<footer><a href="privacy.html">سياسة الخصوصية</a></footer></div>
<div id="bar"><button id="cb" aria-label="افتح السلة"></button></div>
<div id="sh"><div id="sc"></div></div>
<script>
var SB='https://aqmlkutbonkqaozeayot.supabase.co',KEY='sb_publishable_ly2LVyw0xaL2btskq13AUg_jEo7GhBt';
var slug=new URLSearchParams(location.search).get('c'),D=null,cart={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(p){var n=parseFloat(String(p).replace(/[^0-9.]/g,''));return isNaN(n)?0:n}
async function rpc(f,b){var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()}
function cnt(){return Object.values(cart).reduce(function(a,b){return a+b},0)}
function tot(){return D.items.reduce(function(a,i){return a+(cart[i.id]||0)*num(i.price)},0)}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function add(k){cart[k]=(cart[k]||0)+1;draw()}
function sub(k){cart[k]--;if(cart[k]<=0)delete cart[k];draw()}
function draw(){
  $('g').innerHTML=D.items.map(function(i){var q=cart[i.id]||0;
    return '<div class="p"><div class="i">'+(i.img?'<img loading="lazy" alt="" src="'+esc(i.img)+'">':'🛍️')+'</div><div class="b"><b>'+esc(i.name)+'</b><span class="d">'+esc(i.descr)+'</span><span class="pr">'+esc(i.price)+'</span>'+
    (q?'<div class="q"><button data-m="'+i.id+'">−</button><b>'+q+'</b><button data-a="'+i.id+'">+</button></div>':'<button data-a="'+i.id+'" style="margin-top:8px">أضف للسلة</button>')+'</div></div>'}).join('');
  document.querySelectorAll('#g [data-a]').forEach(function(b){b.onclick=function(){add(b.dataset.a)}});
  document.querySelectorAll('#g [data-m]').forEach(function(b){b.onclick=function(){sub(b.dataset.m)}});
  var c=cnt(),t=tot();
  $('bar').style.display=c?'flex':'none';
  $('cb').innerHTML='<span class="ic">🛒<span class="n">'+c+'</span></span><span>السلة</span>'+(t?'<span class="t">'+t+'</span>':'');
  if($('cl'))lines()}
function lines(){
  var L=D.items.filter(function(i){return cart[i.id]});
  if(!L.length){$('sh').style.display='none';return}
  $('cl').innerHTML=L.map(function(i){return '<div class="l"><span>'+esc(i.name)+'</span><span class="ln"><button class="o" data-lm="'+i.id+'">−</button><b>'+cart[i.id]+'</b><button class="o" data-la="'+i.id+'">+</button></span></div>'}).join('')+(tot()?'<div class="l"><b>الإجمالي</b><b>'+tot()+'</b></div>':'');
  document.querySelectorAll('#cl [data-la]').forEach(function(b){b.onclick=function(){add(b.dataset.la)}});
  document.querySelectorAll('#cl [data-lm]').forEach(function(b){b.onclick=function(){sub(b.dataset.lm)}})}
function payHTML(){var h='',row=function(t,v){return '<div class="l"><span>'+t+'</span><span dir="ltr"><b>'+esc(v)+'</b> <button class="o" data-cp="'+esc(v)+'" style="min-height:32px;padding:2px 10px;margin-inline-start:6px">نسخ</button></span></div>'};
  if(D.vcash)h+=row('فودافون كاش',D.vcash);if(D.instapay)h+=row('إنستاباي',D.instapay);if(D.cod)h+='<div class="l"><span>كاش عند الاستلام</span><b>✓</b></div>';if(D.pay)h+='<div class="pay">'+esc(D.pay)+'</div>';
  return h?'<p class="m" style="margin-bottom:0">طرق الدفع (مباشرة لصاحب المحل)</p>'+h+'<p class="m">تأكد من الرقم قبل ما تحوّل.</p>':''}
function sheet(){
  $('sc').innerHTML='<div class="grab"></div><h2 style="margin:0 0 4px">طلبك</h2><div id="cl"></div>'+payHTML()+
  '<input id="fn" placeholder="الاسم" autocomplete="name" value="'+esc(load('sn'))+'"><input id="fp" placeholder="رقم الموبايل" inputmode="tel" autocomplete="tel" dir="ltr" value="'+esc(load('sp'))+'"><input id="fa" placeholder="العنوان (لو توصيل)"><textarea id="fo" placeholder="ملاحظات (اختياري)" rows="2"></textarea>'+
  '<label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0"><input type="checkbox" id="ck" style="width:auto;margin:5px 0 0"><span class="m">راجعت طلبي وبياناتي، وفاهم إن الدفع بيتم مباشرة مع صاحب المحل.</span></label><button id="go" style="width:100%">'+(D.wa?'أرسل الطلب على واتساب':'أرسل الطلب')+'</button><button class="o" id="x" style="width:100%;margin-top:8px">رجوع</button>';
  $('sh').style.display='flex';lines();
  document.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){try{navigator.clipboard.writeText(b.dataset.cp).then(function(){b.textContent='تم النسخ'})}catch(e){}}});
  $('x').onclick=function(){$('sh').style.display='none'};
  $('go').onclick=async function(){
    if(!$('ck').checked)return alert('وافق على التأكيد الأول');var n=$('fn').value.trim(),p=$('fp').value.trim();if(n.length<2||p.length<7)return alert('اكتب اسمك ورقم موبايلك');
    var b=$('go'),lbl=b.textContent;b.disabled=true;b.textContent='جاري الإرسال...';
    try{var ls=Object.keys(cart).map(function(k){return{id:k,q:cart[k]}});
      var r=await rpc('shop_order',{p_slug:slug,p_name:n,p_phone:p,p_addr:$('fa').value,p_notes:$('fo').value,p_lines:ls});
      save('sn',n);save('sp',p);
      var t='طلب جديد من '+n+' ('+p+')\n'+r.lines.map(function(x){return x.q+'× '+x.name+' - '+x.price}).join('\n')+(r.total?'\nالإجمالي: '+r.total:'')+($('fa').value?'\nالعنوان: '+$('fa').value:'')+($('fo').value?'\nملاحظات: '+$('fo').value:'');
      cart={};draw();
      if(!D.wa){$('sc').innerHTML='<div class="grab"></div><h2>تم استلام طلبك ✅</h2><p class="m">صاحب المحل هيتواصل معاك قريب.</p><button id="x2" style="width:100%">تمام</button>';$('x2').onclick=function(){$('sh').style.display='none'};return}
      var u='https://wa.me/'+D.wa+'?text='+encodeURIComponent(t);
      $('sc').innerHTML='<div class="grab"></div><h2>تم استلام طلبك ✅</h2><p class="m">لو واتساب ما فتحش، اضغط الزرار.</p><a href="'+u+'"><button style="width:100%">افتح واتساب</button></a>';
      location.href=u;
    }catch(e){b.disabled=false;b.textContent=lbl;alert(String(e.message)==='400'?'حصلت مشكلة، جرّب تاني':'حصلت مشكلة، جرّب تاني بعد شوية')}}}
(async function(){
  try{if(!slug)throw 0;D=await rpc('shop_get',{p_slug:slug});if(!D)throw 0}catch(e){$('n').textContent='المتجر مش متاح';$('e').textContent='الرابط غلط أو المتجر موقوف.';return}
  document.title=D.name;$('n').textContent=D.name;$('h').textContent=D.hours||'';$('e').style.display=D.items.length?'none':'block';if(!D.items.length)$('e').textContent='لسه مفيش منتجات.';
  $('cb').onclick=sheet;$('sh').onclick=function(e){if(e.target===$('sh'))$('sh').style.display='none'};draw()})();
</script></body></html>
