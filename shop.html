async function track(wa){

    if(cx)h+='<div class="y"><i>✕</i><span>'+t('st_cancelled')+'</span></div>';

    h+='</div>';
    if(r.paid_claimed_at)h+='<p class="m">💳 '+t('paidrep')+' • '+fdt(r.paid_claimed_at)+(r.paid_confirmed_at?'<br>✅ '+t('paidok')+' • '+fdt(r.paid_confirmed_at):'')+'</p>';

    h+='<button class="o" id="x" style="width:100%;margin-top:8px">'+t('ok')+'</button>';

function mkIcon(sz,cb){var cv=document.createElement('canvas');cv.width=cv.height=sz;var x=cv.getContext('2d');x.fillStyle='#0f6b57';x.fillRect(0,0,sz,sz);
  function emo(){x.font=(sz*.56)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(D.emoji||EM[D.type]||'🛍️',sz/2,sz*.54);cb(cv.toDataURL('image/png'))}
  if(D.icon){var im=new Image();im.crossOrigin='anonymous';im.onload=function(){try{var m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);cb(cv.toDataURL('image/png'))}catch(e){emo()}};im.onerror=emo;im.src=D.icon}else emo()}

  document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(function(l){l.href=i2});
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)})})}
