function u8(b){var p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function pushOn(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return toast('جهازك مش بيدعم الإشعارات هنا. على الآيفون: ثبّت التطبيق على الشاشة الرئيسية الأول.');

 Notification.requestPermission().then(function(p){if(p!=='granted'){alert(p==='denied'?'اتمنعت الإشعارات لهذا الموقع. اضغط على القفل 🔒 جنب العنوان > الأذونات (أو إعدادات الموقع) > الإشعارات > سماح، وبعدين حدّث الصفحة وجرّب تاني':'ما ظهرتش نافذة السماح. اضغط تاني واختار «سماح». ولو ما ظهرتش: القفل 🔒 جنب العنوان > الأذونات > الإشعارات > سماح.');throw new Error('shown')}return navigator.serviceWorker.ready}).then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)})})}).then(function(s){var j=s.toJSON();return rpc('owner_push_save',{p_token:TOK,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth})}).then(function(){sset('op','1');D.client.push=Math.max(1,D.client.push||0);toast('تم تفعيل الإشعارات ✅');draw()}).catch(function(e){if(!e||e.message!=='shown')toast('ما اتفعّلتش، جرّب تاني')})}
function pushOff(){navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){if(!s)return;var e=s.endpoint;return s.unsubscribe().then(function(){return rpc('owner_push_del',{p_token:TOK,p_endpoint:e})})}).then(function(){sset('op',null);toast('اتقفلت الإشعارات على الجهاز ده');draw()}).catch(function(){toast('حصلت مشكلة')})}
