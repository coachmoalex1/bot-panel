<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>لوحة عملاء البوت</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"لوحة عملاء البوت","short_name":"عملائي","start_url":".","display":"standalone","background_color":"#0f6b57","theme_color":"#0f6b57","lang":"ar","dir":"rtl","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230f6b57%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2755%27 text-anchor=%27middle%27%3E🤖%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any"}]}'>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#14231e;--mute:#6b7a73;--line:#dfe5dd;--acc:#0f6b57;--acc2:#e9f3ef;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#17221d;--ink:#e8efe9;--mute:#93a39b;--line:#26352e;--acc:#3fc3a0;--acc2:#173229;--warn:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cl{cursor:pointer}.cl b{font-size:17px}
.tag{font-size:13px;color:var(--mute)}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:700}
.pill.off{background:transparent;border:1px solid var(--line);color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.del{background:transparent;color:var(--warn);padding:4px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.ltr{direction:ltr;text-align:left}
.key{direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14px;max-height:340px;overflow:auto}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:99px;padding:14px 22px}
.empty{text-align:center;color:var(--mute);padding:32px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:9}
.login{margin-top:12vh}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">جاري التحميل...</div></div>
<script>
var SB_URL='https://aqmlkutbonkqaozeayot.supabase.co',SB_KEY='sb_publishable_ly2LVyw0xaL2btskq13AUg_jEo7GhBt';
var sb=supabase.createClient(SB_URL,SB_KEY);
var AI_URL='PUT_N8N_WEBHOOK_URL_HERE';
var S={ai:{draft:null},clients:[],view:'list',id:null,tab:'info',user:null};
var TYPES=['مطعم','عيادة','سوبر ماركت','محل ملابس','محل إكسسوارات','شركة','أخرى'];
var DIAL=['مصرية','خليجية','شامية','فصحى مبسطة'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
function newKey(){return 'lb_'+Array.from(crypto.getRandomValues(new Uint8Array(24))).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
function cur(){return S.clients.find(function(c){return c.id===S.id})}
function fail(e){console.error(e);toast('حصلت مشكلة: '+(e&&e.message||'حاول تاني'))}
async function loadAll(){
  var r=await sb.from('clients').select('*, items(*), faqs(*)').order('created_at',{ascending:false});
  if(r.error)return fail(r.error);S.clients=r.data||[]}
async function boot(){
  var r=await sb.auth.getSession();S.user=r.data.session?r.data.session.user:null;
  if(S.user)await loadAll();render()}
function buildPrompt(c){
  var p='أنت مساعد مبيعات وخدمة عملاء لـ"'+c.name+'" ('+c.type+').\nتكلم بالعربية بلهجة '+c.dialect+'، بأسلوب ودود ومختصر.\nرسالة الترحيب: '+c.greet+'\nساعات العمل: '+c.hours+'\n\nالمنتجات والخدمات:\n';
  p+=c.items.length?c.items.map(function(i){return '- '+i.name+' | '+i.price+(i.descr?' | '+i.descr:'')+(i.ok?'':' (غير متاح حالياً)')}).join('\n'):'- لا توجد بيانات بعد';
  p+='\n\nأسئلة شائعة:\n';
  p+=c.faqs.length?c.faqs.map(function(f){return 'س: '+f.q+'\nج: '+f.a}).join('\n'):'- لا توجد بيانات بعد';
  return p+'\n\nقواعد صارمة:\n- جاوب فقط من البيانات أعلاه، ولا تخترع أسعاراً أو معلومات.\n- لو السؤال مش موجود في البيانات قل: "هحولك لأحد الموظفين"'+(c.handoff?' (رقم التحويل: '+c.handoff+')':'')+'.\n- لو العميل عايز يطلب، اجمع: الاسم، الرقم، والطلب، وأكّد معاه.'}

function img64(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function renderAI(a,$){
  var d=S.ai.draft;
  if(!d){
    a.innerHTML='<button class="ghost" id="back">رجوع</button><h1>بوت جديد بالذكاء الاصطناعي</h1><p class="sub">اكتب عن النشاط بأي شكل، أو صوّر المنيو وقائمة الأسعار، وهنجهّز كل حاجة.</p><div class="card"><label>عن النشاط</label><textarea id="aiT" placeholder="مثال: مطعم الشرق، مأكولات شرقية، من 12 ظهراً لـ 12 بالليل، كشري 40 جنيه، فراخ مشوية 120 جنيه..."></textarea><label>صورة المنيو أو الأسعار (اختياري)</label><input id="aiI" type="file" accept="image/*"><button id="aiGo" style="width:100%;margin-top:14px">جهّز البوت</button></div>';
    $('back').onclick=function(){S.view='list';render()};
    $('aiGo').onclick=async function(){
      var t=$('aiT').value.trim(),f=$('aiI').files[0];
      if(!t&&!f)return toast('اكتب وصف أو ارفع صورة');
      if(AI_URL.indexOf('PUT_')===0)return toast('رابط الذكاء الاصطناعي لسه مش متحط');
      var b=$('aiGo');b.disabled=true;b.textContent='جاري التجهيز... (دقيقة تقريباً)';
      try{
        var im=f?await img64(f):null;
        var r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,image:im})});
        if(!r.ok)throw new Error('رد السيرفر '+r.status);
        var j=await r.json();if(j&&j.output)j=j.output;if(typeof j==='string')j=JSON.parse(j.replace(/```json|```/g,''));
        j.items=Array.isArray(j.items)?j.items:[];j.faqs=Array.isArray(j.faqs)?j.faqs:[];
        if(TYPES.indexOf(j.type)<0)j.type='أخرى';if(DIAL.indexOf(j.dialect)<0)j.dialect='مصرية';
        S.ai.draft=j;render();
      }catch(e){fail(e);b.disabled=false;b.textContent='جهّز البوت'}
    };
    return}
  var h='<button class="ghost" id="back">رجوع</button><h1>راجع البيانات</h1><p class="sub">عدّل أي حاجة غلط، وبعدين اضغط حفظ وتفعيل.</p><div class="card">'+
  '<label>اسم النشاط</label><input data-d="name" value="'+esc(d.name)+'">'+
  '<label>نوع النشاط</label><select data-d="type">'+TYPES.map(function(t){return '<option'+(t===d.type?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
  '<label>اللهجة</label><select data-d="dialect">'+DIAL.map(function(t){return '<option'+(t===d.dialect?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
  '<label>رسالة الترحيب</label><textarea data-d="greet">'+esc(d.greet)+'</textarea>'+
  '<label>ساعات العمل</label><input data-d="hours" value="'+esc(d.hours)+'">'+
  '<label>رقم التحويل لموظف</label><input data-d="handoff" class="ltr" inputmode="tel" value="'+esc(d.handoff)+'"></div>';
  h+='<h1 style="font-size:19px">المنتجات ('+d.items.length+')</h1>';
  d.items.forEach(function(i,n){h+='<div class="card"><div class="two"><input data-in="'+n+'" value="'+esc(i.name)+'"><input data-ip="'+n+'" value="'+esc(i.price)+'"></div><button class="del" data-ri="'+n+'">حذف</button></div>'});
  h+='<h1 style="font-size:19px">الأسئلة الشائعة ('+d.faqs.length+')</h1>';
  d.faqs.forEach(function(f,n){h+='<div class="card"><input data-fq="'+n+'" value="'+esc(f.q)+'"><textarea data-fa="'+n+'" style="margin-top:6px">'+esc(f.a)+'</textarea><button class="del" data-rf="'+n+'">حذف</button></div>'});
  h+='<button id="sv" style="width:100%;margin-top:6px">حفظ وتفعيل</button>';
  a.innerHTML=h;
  $('back').onclick=function(){S.ai.draft=null;render()};
  a.querySelectorAll('[data-d]').forEach(function(e){e.onchange=function(){d[e.dataset.d]=e.value}});
  a.querySelectorAll('[data-in]').forEach(function(e){e.onchange=function(){d.items[e.dataset.in].name=e.value}});
  a.querySelectorAll('[data-ip]').forEach(function(e){e.onchange=function(){d.items[e.dataset.ip].price=e.value}});
  a.querySelectorAll('[data-fq]').forEach(function(e){e.onchange=function(){d.faqs[e.dataset.fq].q=e.value}});
  a.querySelectorAll('[data-fa]').forEach(function(e){e.onchange=function(){d.faqs[e.dataset.fa].a=e.value}});
  a.querySelectorAll('[data-ri]').forEach(function(e){e.onclick=function(){d.items.splice(e.dataset.ri,1);render()}});
  a.querySelectorAll('[data-rf]').forEach(function(e){e.onclick=function(){d.faqs.splice(e.dataset.rf,1);render()}});
  $('sv').onclick=async function(){
    var b=$('sv');b.disabled=true;
    try{
      var r=await sb.from('clients').insert({name:d.name||'',type:d.type,dialect:d.dialect,greet:d.greet||'',hours:d.hours||'',handoff:d.handoff||'',active:true}).select().single();
      if(r.error)throw r.error;var id=r.data.id;
      if(d.items.length){var x=await sb.from('items').insert(d.items.map(function(i){return{client_id:id,name:String(i.name||''),price:String(i.price==null?'':i.price),descr:String(i.descr||'')}}));if(x.error)throw x.error}
      if(d.faqs.length){var y=await sb.from('faqs').insert(d.faqs.map(function(f){return{client_id:id,q:String(f.q||''),a:String(f.a||'')}}));if(y.error)throw y.error}
      await loadAll();S.ai.draft=null;S.id=id;S.view='detail';S.tab='info';render();toast('تم إنشاء البوت');
    }catch(e){fail(e);b.disabled=false}
  };
}
function render(){
  var a=document.getElementById('app'),$=function(i){return document.getElementById(i)};
  if(!S.user){
    a.innerHTML='<div class="login"><h1>لوحة عملائي</h1><p class="sub">سجّل دخولك للمتابعة</p><div class="card"><label>الإيميل</label><input id="em" type="email" class="ltr" autocomplete="username"><label>الباسورد</label><input id="pw" type="password" class="ltr" autocomplete="current-password"><button id="go" style="width:100%;margin-top:14px">دخول</button></div></div>';
    $('go').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)return toast('الإيميل أو الباسورد غلط');S.user=r.data.user;await loadAll();render()};
    return}
  if(S.view==='ai')return renderAI(a,$);
  if(S.view==='list'){
    var h='<div class="row"><h1>عملائي</h1><button class="ghost" id="out">خروج</button></div><p class="sub">كل عميل له بياناته ومفتاحه الخاص</p>';
    h+='<button id="aiNew" style="width:100%;margin-bottom:12px">✨ بوت جديد بالذكاء الاصطناعي</button>';
    if(!S.clients.length)h+='<div class="empty">لسه مفيش عملاء.<br>اضغط «عميل جديد» وابدأ.</div>';
    S.clients.forEach(function(c){h+='<div class="card cl" data-open="'+c.id+'"><div class="row"><b>'+esc(c.name)+'</b><span class="pill'+(c.active?'':' off')+'">'+(c.active?'شغال':'موقوف')+'</span></div><div class="tag">'+esc(c.type)+' • '+c.items.length+' منتج • '+c.faqs.length+' سؤال</div></div>'});
    h+='<button class="fab" id="add">+ عميل جديد</button>';
    a.innerHTML=h;
    $('out').onclick=async function(){await sb.auth.signOut();S.user=null;S.clients=[];render()};
    $('aiNew').onclick=function(){S.ai.draft=null;S.view='ai';render()};
    $('add').onclick=async function(){var r=await sb.from('clients').insert({greet:'أهلاً بحضرتك! أقدر أساعدك إزاي؟',hours:'يومياً من 10 صباحاً إلى 10 مساءً'}).select().single();if(r.error)return fail(r.error);r.data.items=[];r.data.faqs=[];S.clients.unshift(r.data);S.id=r.data.id;S.view='detail';S.tab='info';render()};
    a.querySelectorAll('[data-open]').forEach(function(e){e.onclick=function(){S.id=e.dataset.open;S.view='detail';S.tab='info';render()}});
    return}
  var c=cur();if(!c){S.view='list';return render()}
  var h='<button class="ghost" id="back">رجوع</button><h1>'+esc(c.name)+'</h1>';
  var T=[['info','البيانات'],['items','المنتجات'],['faqs','الأسئلة'],['key','المفتاح'],['prompt','البرومبت']];
  h+='<div class="tabs">'+T.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(S.tab==='info'){
    h+='<div class="card"><label>اسم النشاط</label><input data-f="name" value="'+esc(c.name)+'">'+
    '<label>نوع النشاط</label><select data-f="type">'+TYPES.map(function(t){return '<option'+(t===c.type?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
    '<label>اللهجة</label><select data-f="dialect">'+DIAL.map(function(t){return '<option'+(t===c.dialect?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
    '<label>رسالة الترحيب</label><textarea data-f="greet">'+esc(c.greet)+'</textarea>'+
    '<label>ساعات العمل</label><input data-f="hours" value="'+esc(c.hours)+'">'+
    '<label>رقم التحويل لموظف</label><input data-f="handoff" inputmode="tel" class="ltr" value="'+esc(c.handoff)+'">'+
    '<label>Phone Number ID (من Meta)</label><input data-f="phone_number_id" class="ltr" value="'+esc(c.phone_number_id)+'">'+
    '<label>توكن الواتساب (من Meta)</label><input data-f="token" class="ltr" value="'+esc(c.token)+'">'+
    '<div class="row" style="margin-top:14px"><span>حالة البوت</span><button class="ghost" id="tog">'+(c.active?'شغال، اضغط للإيقاف':'موقوف، اضغط للتشغيل')+'</button></div></div><button class="del" id="rm">حذف العميل</button>'}
  if(S.tab==='items'){
    h+='<div class="card"><label>الاسم</label><input id="in"><div class="two"><div><label>السعر</label><input id="ip" inputmode="decimal"></div><div><label>&nbsp;</label><button id="ia" style="width:100%">إضافة</button></div></div><label>وصف (اختياري)</label><input id="id"></div>';
    if(!c.items.length)h+='<div class="empty">ضيف أول منتج أو خدمة.</div>';
    c.items.forEach(function(i){h+='<div class="card"><div class="row"><b>'+esc(i.name)+' — '+esc(i.price)+'</b><button class="del" data-di="'+i.id+'">حذف</button></div>'+(i.descr?'<div class="tag">'+esc(i.descr)+'</div>':'')+'<button class="ghost" data-ok="'+i.id+'" style="margin-top:6px">'+(i.ok?'متاح':'غير متاح')+'</button></div>'})}
  if(S.tab==='faqs'){
    h+='<div class="card"><label>السؤال</label><input id="fq"><label>الإجابة</label><textarea id="fa"></textarea><button id="fadd" style="margin-top:10px">إضافة</button></div>';
    if(!c.faqs.length)h+='<div class="empty">ضيف الأسئلة اللي الناس بتسألها كتير.</div>';
    c.faqs.forEach(function(f){h+='<div class="card"><div class="row"><b>'+esc(f.q)+'</b><button class="del" data-df="'+f.id+'">حذف</button></div><div class="tag">'+esc(f.a)+'</div></div>'})}
  if(S.tab==='key'){
    h+='<div class="card"><p class="sub">المفتاح ده بيعرّف الـ workflow إن الرسالة تبع العميل ده.</p><div class="key">'+esc(c.api_key)+'</div><div class="row" style="margin-top:10px"><button id="cpk">نسخ</button><button class="ghost" id="newk">مفتاح جديد</button></div></div>'}
  if(S.tab==='prompt'){
    h+='<p class="sub">البرومبت بيتبني تلقائياً من بيانات العميل.</p><pre>'+esc(buildPrompt(c))+'</pre><button id="cpp" style="margin-top:10px">نسخ البرومبت</button>'}
  a.innerHTML=h;
  $('back').onclick=function(){S.view='list';render()};
  a.querySelectorAll('[data-tab]').forEach(function(e){e.onclick=function(){S.tab=e.dataset.tab;render()}});
  a.querySelectorAll('[data-f]').forEach(function(e){e.onchange=async function(){var f=e.dataset.f,o={};o[f]=e.value;var r=await sb.from('clients').update(o).eq('id',c.id);if(r.error)return fail(r.error);c[f]=e.value;toast('تم الحفظ');if(f==='name')render()}});
  if($('tog'))$('tog').onclick=async function(){var r=await sb.from('clients').update({active:!c.active}).eq('id',c.id);if(r.error)return fail(r.error);c.active=!c.active;render()};
  if($('rm'))$('rm').onclick=async function(){if(!confirm('حذف العميل نهائياً؟'))return;var r=await sb.from('clients').delete().eq('id',c.id);if(r.error)return fail(r.error);S.clients=S.clients.filter(function(x){return x!==c});S.view='list';render()};
  if($('ia'))$('ia').onclick=async function(){var n=$('in').value.trim();if(!n)return toast('اكتب الاسم');var r=await sb.from('items').insert({client_id:c.id,name:n,price:$('ip').value.trim(),descr:$('id').value.trim()}).select().single();if(r.error)return fail(r.error);c.items.push(r.data);render()};
  a.querySelectorAll('[data-di]').forEach(function(e){e.onclick=async function(){var r=await sb.from('items').delete().eq('id',e.dataset.di);if(r.error)return fail(r.error);c.items=c.items.filter(function(i){return i.id!==e.dataset.di});render()}});
  a.querySelectorAll('[data-ok]').forEach(function(e){e.onclick=async function(){var i=c.items.find(function(x){return x.id===e.dataset.ok});var r=await sb.from('items').update({ok:!i.ok}).eq('id',i.id);if(r.error)return fail(r.error);i.ok=!i.ok;render()}});
  if($('fadd'))$('fadd').onclick=async function(){var q=$('fq').value.trim();if(!q)return toast('اكتب السؤال');var r=await sb.from('faqs').insert({client_id:c.id,q:q,a:$('fa').value.trim()}).select().single();if(r.error)return fail(r.error);c.faqs.push(r.data);render()};
  a.querySelectorAll('[data-df]').forEach(function(e){e.onclick=async function(){var r=await sb.from('faqs').delete().eq('id',e.dataset.df);if(r.error)return fail(r.error);c.faqs=c.faqs.filter(function(f){return f.id!==e.dataset.df});render()}});
  function cp(t){try{navigator.clipboard.writeText(t).then(function(){toast('تم النسخ')},function(){toast('النسخ غير متاح')})}catch(e){toast('النسخ غير متاح')}}
  if($('cpk'))$('cpk').onclick=function(){cp(c.api_key)};
  if($('newk'))$('newk').onclick=async function(){if(!confirm('المفتاح القديم هيبطل يشتغل. متأكد؟'))return;var k=newKey();var r=await sb.from('clients').update({api_key:k}).eq('id',c.id);if(r.error)return fail(r.error);c.api_key=k;render()};
  if($('cpp'))$('cpp').onclick=function(){cp(buildPrompt(c))};
}
boot();
</script>
</body>
</html>
