  a.querySelectorAll('[data-df]').forEach(function(e){e.onclick=async function(){var r=await sb.from('faqs').delete().eq('id',e.dataset.df);if(r.error)return fail(r.error);c.faqs=c.faqs.filter(function(f){return f.id!==e.dataset.df});render()}});

  a.querySelectorAll('[data-st]').forEach(function(e){e.onclick=async function(){var o=c.orders.find(function(x){return x.id===e.dataset.st}),ns=e.dataset.ns;if(ns==='cancelled'&&!confirm('إلغاء الطلب؟'))return;var r=await sb.from('orders').update({status:ns}).eq('id',o.id);if(r.error)return fail(r.error);o.status=ns;c.on=c.orders.filter(function(y){return isOpen(y.status||'new')}).length;render()}});

    var sa=isSA(c),o={pay_cod:$('pc').checked,pay_info:$('pn').value.trim()};

    }else{var v=($('pv').value||'').replace(/[\s\-+]/g,'').replace(/^20/,'0'),ip=$('pi').value.trim();

      Object.assign(o,{pay_vcash:v,pay_instapay:ip})}

    var sm=[o.pay_vcash&&'فودافون كاش: '+o.pay_vcash,o.pay_instapay&&'إنستاباي: '+o.pay_instapay,o.pay_stcpay&&'STC Pay: '+o.pay_stcpay,o.pay_iban&&'آيبان: '+o.pay_iban+' ('+o.pay_holder+')',o.pay_pos&&'مدى/بطاقة عند الاستلام',o.pay_cod&&'كاش عند الاستلام'].filter(Boolean).join('\n');
    if(!confirm('راجع بياناتك:\n'+sm+'\n\nالبيانات دي صح؟'))return;
    o.pay_confirmed_at=new Date().toISOString();
    var r=await sb.from('clients').update(o).eq('id',c.id);if(r.error)return fail(r.error);Object.assign(c,o);toast('تم الحفظ والتأكيد');render()};

  if(S.tab==='promo'&&!c.offers)sb.from('offers').select('*').eq('client_id',c.id).order('created_at',{ascending:false}).then(function(x){c.offers=x.error?[]:x.data;render()});

  a.querySelectorAll('[data-mx]').forEach(function(e){e.onclick=function(){var M=menuList(c).slice();M.splice(+e.dataset.mx,1);setC({menu_urls:M,menu_url:null})}});

  if($('oa'))$('oa').onclick=async function(){var t=$('ot').value.trim();if(!t)return toast('اكتب عنوان العرض');var b=$('oa');b.disabled=true;try{var f=$('oi').files[0],u=f?await upImg(c.id,f,900):null,r=await sb.from('offers').insert({client_id:c.id,title:t,price:$('op').value.trim(),descr:$('od').value.trim(),ends_at:$('oe').value||null,image_url:u}).select().single();if(r.error)throw r.error;c.offers.unshift(r.data);render();toast('تم نشر العرض')}catch(e){fail(e);b.disabled=false}};
  a.querySelectorAll('[data-do]').forEach(function(e){e.onclick=async function(){var r=await sb.from('offers').delete().eq('id',e.dataset.do);if(r.error)return fail(r.error);c.offers=c.offers.filter(function(o){return o.id!==e.dataset.do});render()}});
  function cp(t){try{navigator.clipboard.writeText(t).then(function(){toast('تم النسخ')},function(){toast('النسخ غير متاح')})}catch(e){toast('النسخ غير متاح')}}
function tgCall(act){return sb.auth.getSession().then(function(ss){return fetch(SB_URL+'/functions/v1/super-api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.data.session.access_token,apikey:SB_KEY},body:JSON.stringify({action:act,client_id:c.id})})}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||('خطأ '+r.status+(r.status===401?' — تأكد إن Verify JWT مقفول على super-api':'')));return j})})}
var QS=['اسم النشاط وإيه اللي بتقدموه؟','العنوان فين؟','مواعيد العمل؟','بتوصّلوا؟ وبكام التوصيل؟','طرق الدفع إيه؟','ازاي أطلب؟','فيه حجز مسبق؟','رقم التواصل؟','فيه عروض دلوقتي؟','بتقبلوا فيزا؟','فيه فرع تاني؟','مدة التحضير أو التوصيل كام؟','سياسة الإلغاء والاسترجاع؟'];
function qDrawer(att,txt){return '<details class="card qd"><summary>💡 أسئلة جاهزة تساعدك تكمّل بياناتك <span class="fh">('+QS.length+')</span></summary><p class="fh">'+txt+'</p><div class="subtabs" style="margin:0">'+QS.map(function(q){return '<button '+att+'="'+esc(q)+'">'+esc(q)+'</button>'}).join('')+'</div></details>'}
function botCall(act,extra){return sb.auth.getSession().then(function(ss){return fetch(SB_URL+'/functions/v1/super-api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.data.session.access_token,apikey:SB_KEY},body:JSON.stringify(Object.assign({action:act,client_id:c.id},extra||{}))})}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||('خطأ '+r.status));return j})})}
function tgShow(j){var el=$('tgSt');if(!el)return;if(j.jwt_on){el.style.color='#dc2626';el.textContent='❌ سبب الـ401: خيار Verify JWT شغّال على دالة super-api في Supabase. افتح Edge Functions > super-api > Details وقفل Verify JWT (OFF) واحفظ، ثم اضغط «إعادة ربط البوت».'}else if(j.last_error){el.style.color='#dc2626';el.textContent='❌ تليجرام بيقول: '+j.last_error+(/401/.test(j.last_error)?' — اضغط «إعادة ربط البوت» وبعدها «فحص البوت»، ولو فضل يظهر راجع إن Verify JWT مقفول على super-api.':'')}else if(!j.linked){el.style.color='#d97706';el.textContent='⚠️ البوت @'+j.username+' مش متربط على السيرفر. اضغط «إعادة ربط البوت».'}else{el.style.color='#16a34a';el.textContent='✅ @'+j.username+' متربط وشغال'+(j.pending?' ('+j.pending+' رسالة مستنية)':'')+'. ابعتله /start وجرّب.'}}
if($('tgGo2'))$('tgGo2').onclick=async function(){var b=$('tgGo2'),tk=$('tgTok').value.trim();if(!/^\d+:[\w-]{20,}$/.test(tk))return toast('التوكن شكله غلط. انسخه كامل من BotFather');b.disabled=true;try{var u=await sb.from('clients').update({tg_token:tk}).eq('id',c.id);if(u.error)throw u.error;c.tg_token=tk;var j=await tgCall('tg_connect');toast('البوت اشتغل: @'+j.username);tgShow(j)}catch(e){fail(e)}b.disabled=false};
function abShow(j){var o=$('abOut');o.innerHTML=(j.points_to_push?'✅ الربط سليم: البوت @'+esc(j.bot)+' بيشاور على نظام الإشعارات':j.points_to_super?'⚠️ البوت @'+esc(j.bot)+' متربط غلط على بوت العملاء (ده سبب إنه بيرد زي بوت عميل). اضغط «إصلاح الربط»':j.has_url?'⚠️ البوت @'+esc(j.bot)+' متربط على عنوان تاني. اضغط «إصلاح الربط»':'⚠️ البوت @'+esc(j.bot)+' مش متربط خالص. اضغط «إصلاح الربط»')+(j.last_error?'<br>آخر خطأ من تليجرام: '+esc(j.last_error):'')}

  if($('abFix'))$('abFix').onclick=async function(){var b=$('abFix');b.disabled=true;$('abOut').textContent='جاري الإصلاح...';try{abShow(await botCall('admin_bot_hook'))}catch(e){$('abOut').textContent='❌ '+(e.message||e)}b.disabled=false};
  if($('btGo'))$('btGo').onclick=async function(){var b=$('btGo'),m=$('btMsg').value.trim(),o=$('btOut');if(!m)return toast('اكتب رسالة للتجربة');b.disabled=true;o.style.display='block';o.textContent='جاري التجربة...';try{var j=await botCall('bot_test',{message:m});o.textContent=j.ok?j.reply+'\n\n⏱ '+(j.ms/1000).toFixed(1)+' ثانية'+(j.note?'\n'+j.note:''):'❌ '+j.error}catch(e){o.textContent='❌ '+(e.message||e)}b.disabled=false};
    if($('wrChk'))$('wrChk').onclick=async function(){var b=$('wrChk'),o=$('wrOut');b.disabled=true;o.textContent='جاري الفحص...';try{var j=await botCall('wa_ready');o.innerHTML=j.checks.map(function(x){return(x.ok?'✅ ':'⚠️ ')+esc(x.t)}).join('<br>')}catch(e){o.textContent='❌ '+(e.message||e)}b.disabled=false};
    if($('tgChk'))$('tgChk').onclick=async function(){var b=$('tgChk');b.disabled=true;try{tgShow(await tgCall('tg_status'))}catch(e){fail(e)}b.disabled=false};

  if($('tgBot'))$('tgBot').onclick=async function(){var b=$('tgBot');b.disabled=true;try{var ss=await sb.auth.getSession(),r=await fetch(SB_URL+'/functions/v1/super-api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.data.session.access_token,apikey:SB_KEY},body:JSON.stringify({action:'tg_connect',client_id:c.id})}),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);toast('بوت تليجرام اشتغل: @'+j.username)}catch(e){fail(e)}b.disabled=false};

}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
boot();
